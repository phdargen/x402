[package]
name = "x402-attribution-script"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "prove"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[[bin]]
name = "fixture"
path = "src/bin/fixture.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
serde_json = { workspace = true }
serde = { workspace = true }
clap = { version = "4.0", features = ["derive", "env"] }
hex = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
x402-attribution-core = { path = "../lib" }
k256 = { workspace = true }
dotenv = "0.15.0"

[build-dependencies]
sp1-build = { version = "6.0.1" }
