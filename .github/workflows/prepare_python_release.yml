name: Prepare Python Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Python SDK release version in X.Y.Z format. Leave blank to use bump."
        required: false
        type: string
      bump:
        description: "Version bump to use when version is blank. Scheduled releases always use minor."
        required: false
        default: minor
        type: choice
        options:
          - minor
          - patch
  schedule:
    - cron: "0 10 * * 5"

permissions:
  contents: write
  pull-requests: write
  id-token: none

jobs:
  prepare-python-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "python/x402/uv.lock"

      - name: Set up Python
        working-directory: ./python/x402
        run: uv python install

      - name: Install dependencies
        working-directory: ./python/x402
        run: uv sync --all-extras --dev

      - name: Prepare release branch
        id: branch
        run: |
          set -euo pipefail

          branch="release/python-$(date -u +%F)"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Python release files
        id: prep
        working-directory: ./python/x402
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          INPUT_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'minor' }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            uv run python scripts/prepare-release.py --version "${INPUT_VERSION}"
          else
            uv run python scripts/prepare-release.py --bump "${INPUT_BUMP}"
          fi

          version="$(
            uv run python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml")
          match = re.search(r'^version = "([^"]+)"$', pyproject.read_text(), re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read Python SDK version from pyproject.toml")
          print(match.group(1))
          PY
          )"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub-signed release commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          paths=(
            python/x402/pyproject.toml
            python/x402/__init__.py
            python/x402/CHANGELOG.md
            python/x402/changelog.d
          )

          git status --short -- "${paths[@]}"
          if git diff --quiet -- "${paths[@]}"; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_paths="$(mktemp)"
          tree_entries="$(mktemp)"
          jq -n '[]' > "${tree_entries}"

          git diff --name-only -- "${paths[@]}" > "${changed_paths}"
          while IFS= read -r path; do
            if [[ -f "${path}" ]]; then
              blob_sha="$(
                jq -n --rawfile content "${path}" '{content: $content, encoding: "utf-8"}' |
                  gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha'
              )"
              entry="$(jq -n \
                --arg path "${path}" \
                --arg sha "${blob_sha}" \
                '{path: $path, mode: "100644", type: "blob", sha: $sha}')"
            else
              entry="$(jq -n \
                --arg path "${path}" \
                '{path: $path, mode: "100644", type: "blob", sha: null}')"
            fi

            jq --argjson entry "${entry}" '. + [$entry]' "${tree_entries}" > "${tree_entries}.tmp"
            mv "${tree_entries}.tmp" "${tree_entries}"
          done < "${changed_paths}"

          base_sha="$(git rev-parse HEAD)"
          base_tree_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq '.tree.sha'
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "${base_tree_sha}" \
              --slurpfile tree "${tree_entries}" \
              '{base_tree: $base_tree, tree: $tree[0]}' |
              gh api "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message "chore: version python package" \
              --arg tree "${tree_sha}" \
              --arg parent "${base_sha}" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha'
          )"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            jq -n --arg sha "${commit_sha}" '{sha: $sha, force: true}' |
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" --input -
          else
            jq -n --arg ref "refs/heads/${BRANCH}" --arg sha "${commit_sha}" '{ref: $ref, sha: $sha}' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" --input -
          fi

          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Create or update release PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.prep.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          title="chore: prepare Python SDK release ${VERSION}"
          body="$(
            cat <<EOF
          ## Summary
          - Bumps the Python SDK package version to ${VERSION}.
          - Rebuilds the Python SDK changelog with Towncrier.

          ## Test plan
          - GitHub Actions will run the Python package checks on this PR.
          - After merge, manually run "Publish x402 to PyPI" and create the signed pypi tag.
          EOF
          )"

          if gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${BRANCH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body "${body}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "${title}" \
              --body "${body}"
          fi
