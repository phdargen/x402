name: Verified Commits

on:
  workflow_run:
    workflows: ["Pull Request Labeler"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: none

jobs:
  check-verified-commits:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure commits are verified
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRun = context.payload.workflow_run;
            const marker = '<!-- verified-commits-required -->';
            const unverifiedLabel = 'unverified';
            const ignoreNotFound = error => {
              if (error.status !== 404) {
                throw error;
              }
            };

            const resolvePullRequest = async () => {
              const linkedPullRequest = workflowRun.pull_requests?.[0];
              if (linkedPullRequest?.number) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: linkedPullRequest.number
                });
                return data;
              }

              // Fork PRs do not populate workflow_run.pull_requests.
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });
              const pullRequest = pullRequests.find(
                candidate => candidate.head.sha === workflowRun.head_sha
              );
              if (!pullRequest) {
                core.warning('Could not resolve pull request for workflow run, skipping.');
                return null;
              }

              return pullRequest;
            };

            const pullRequest = await resolvePullRequest();
            if (!pullRequest) {
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100
            });

            const unverifiedCommits = commits.filter(commit => !commit.commit.verification?.verified);

            if (unverifiedCommits.length === 0) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pullRequest.number,
                name: unverifiedLabel
              }).catch(ignoreNotFound);
              core.notice('All pull request commits are verified.');
              return;
            }

            await github.rest.issues.getLabel({
              owner,
              repo,
              name: unverifiedLabel
            }).catch(async error => {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: unverifiedLabel,
                color: 'd73a4a',
                description: 'Pull request contains unverified commits'
              });
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: [unverifiedLabel]
            });

            const commitList = unverifiedCommits
              .map(commit => '- `' + commit.sha.slice(0, 7) + '`: ' + (commit.commit.verification?.reason || 'unverified'))
              .join('\n');
            const body = [
              marker,
              'Thanks for your contribution @' + pullRequest.user.login + '!',
              'Note that we require commit signing, please rebase and verify your commits.',
              '',
              'See here for instructions: https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification',
              '',
              'The team will not review this PR before ALL commits have been verified and it will be closed after 1 week of inactivity.',
              '',
              'Unverified commits:',
              commitList
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100
            });
            const existingComment = comments.find(comment => (
              comment.user.type === 'Bot' && comment.body.includes(marker)
            ));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body
              });
            }

            core.setFailed('Pull request contains unverified commits.');
