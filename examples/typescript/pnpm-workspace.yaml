packages:
  - "scripts"
  - "templates/*"
  - "templates/cloudfront-lambda-edge"
  - "templates/cloudfront-lambda-edge/lambda"
  - "templates/cloudfront-lambda-edge/cdk"
  - "../../typescript/packages/core"
  - "../../typescript/packages/extensions"
  - "../../typescript/packages/mcp"
  - "../../typescript/packages/http/*"
  - "../../typescript/packages/mechanisms/*"
minimumReleaseAge: 4320 # Only install package versions that have been published for at least 3 days.
minimumReleaseAgeStrict: true
allowBuilds:
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
