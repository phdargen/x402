packages:
  - "facilitators/*"
  - "facilitators/external-proxies/*"
  - "facilitators/external-proxies/local/*"
  - "servers/*"
  - "clients/*"
  - "clients/external/*"
  - "legacy/servers/*"
  - "legacy/clients/*"
  - "../typescript/packages/*"
  - "../typescript/packages/http/*"
  - "../typescript/packages/mechanisms/*"
  - "../typescript/packages/legacy/*"
allowBuilds:
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
