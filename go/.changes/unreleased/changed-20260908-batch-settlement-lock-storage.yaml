kind: changed
body: Move batch-settlement admission locks off the durable ChannelSession record onto ChannelLockStorage. BeforeVerify acquires the lock after cheap local rejects, then does one storage.Get; AfterVerify only stashes extras. pendingRequest is removed from ChannelSession (breaking for custom storage implementors; leftover pendingRequest JSON is ignored, no backfill). InMemory, File, and Redis implement both roles; pass LockStorage to mix backends.
time: 2026-09-08T14:00:00Z
