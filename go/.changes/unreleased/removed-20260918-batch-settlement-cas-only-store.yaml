kind: removed
body: Remove blind Set/Delete from the server-side batch-settlement channel store for TS parity. ChannelStorage is now Get/List/UpdateChannel CAS-only; server UpdateSession/DeleteSession and InMemory/File/Redis adapter Set/Delete are gone. Upsert via UpdateChannel returning the new value, delete via UpdateChannel returning the zero value. The Redis update Lua script drops the "*" anywhere sentinel and matches TS UPDATE_CHANNEL_SCRIPT. Client ClientChannelStorage is untouched.
time: 2026-09-18T14:00:00Z
