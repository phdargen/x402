kind: added
body: Add facilitator-managed voucher custody for batch-settlement EVM. VoucherStoreModeFacilitator with extra.voucherStore, refundAuth consent, pendingId admission locks with cancel release, chargeCount attestation on commit (attested onchain per claim in the ERC-8021 m.x402ChargeCounts metadata, which needs no builder code, and read back with DecodeClaimAttestation, which joins claim rows to Claimed events by channelId), a shared storage package (in-memory, file, Redis) with worker query helpers, and facilitator claim/settle coordination.
time: 2026-09-18T12:00:00Z
