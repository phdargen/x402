kind: added
body: Add facilitator-managed voucher custody for batch-settlement EVM. VoucherStoreModeFacilitator with extra.voucherManager ("server" | "facilitator"; /supported advertises the supported managers and an omitted value means "server"), a boolean extra.delegatedRefund on /supported (always emitted; true iff the facilitator configures ResolveCallerIdentity; an absent field means a legacy facilitator) plus a managed server RefundAuthorizerSigner (the 402 then carries extra.refundAuthorizer; without a signer the server relies on delegatedRefund and the 402 omits it) so managed refunds are authorized by a server signature or by caller identity (the facilitator strips client signatures and re-signs), pendingId admission locks with cancel release, chargeCount attestation on commit (attested onchain per claim in the ERC-8021 m.x402ChargeCounts metadata, which needs no builder code, and read back with DecodeClaimAttestation, which joins claim rows to Claimed events by channelId), a shared storage package (in-memory, file, Redis) with worker query helpers, and facilitator claim/settle coordination. Self-managed behavior is unchanged.
time: 2026-09-18T12:00:00Z
