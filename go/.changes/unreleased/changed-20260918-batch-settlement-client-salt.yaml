kind: changed
body: Batch-settlement client accepts channel salt as a non-negative index or bytes32 hex and packs extra.refundAuthorizer into ChannelConfig.salt only for facilitator-managed 402s (voucherManager "facilitator" with a non-zero refundAuthorizer) so channelId matches managed refund requirements; self-managed channelIds are unchanged. README documents facilitator-managed custody, submit modes, and client salt behavior.
