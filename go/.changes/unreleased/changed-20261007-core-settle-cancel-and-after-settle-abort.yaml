kind: changed
body: Call scheme SettleOnCancel even when no before-handler settle has completed, passing the completed phases so the scheme decides. A failure-path receipt includes a cancel settle only when a before-handler settlement exists; otherwise it echoes that settlement or is omitted. AfterSettleAbortError fails an onchain-successful settle closed (success false, keeping transaction, amount, payer, and onchain extra) on the normal path and the beforeSettle skip path; other afterSettle errors stay non-fatal. SVM upto SettleOnCancel returns nothing unless the before-handler deposit already settled.
time: 2026-10-07T21:30:00Z
