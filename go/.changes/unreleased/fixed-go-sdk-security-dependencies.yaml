kind: changed
body: Upgrade the Go SDK minimum Go version to 1.26.10 and bump dependencies (`echo/v4` v4.16.2, `modelcontextprotocol/go-sdk` v1.8.0, `quic-go` v0.64.1, `klauspost/compress` v1.20.3, `otel` v1.47.0, `golang.org/x/net` v0.62.0, `golang.org/x/crypto` v0.58.0, `golang.org/x/sys` v0.49.0, `golang.org/x/text` v0.43.0) to resolve published security advisories. Go 1.24 and 1.25 toolchains no longer build the module without upgrading to Go >= 1.26.10.
